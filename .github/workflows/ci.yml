name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest unit)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare runtime environment
        # 全新克隆没有 git 忽略的运行时前提：部分单测读取 backend/chaoxing_config.json
        # 与仓库根 data/temp、data/output、data/logs（开发机上天然存在）
        shell: pwsh
        run: |
          Copy-Item chaoxing_config.example.json chaoxing_config.json
          New-Item -ItemType Directory -Force -Path ..\data\temp, ..\data\output, ..\data\logs | Out-Null

      - name: Run unit tests
        # 仅单测：integration / e2e 需要真实浏览器与凭据，不在 CI 范围
        run: python -m pytest tests/unit -q -s

  frontend:
    name: Frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
